[project]
name = "ai-portfolio"
version = "0.1.0"
description = "AI Engineer & Data Scientist portfolio featuring modular ML/AI pipelines and FastAPI services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.28.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "polars>=1.19.0",
  "pyarrow>=18.0.0",
  "scikit-learn>=1.6.0",
  "scipy>=1.14.0",
  "matplotlib>=3.10.0",
  "seaborn>=0.13.2",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
]

[project.optional-dependencies]
providers = [
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langchain-community>=0.3.0",
]
notebooks = [
  "jupyterlab>=4.3.0",
  "ipykernel>=6.29.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_portfolio"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
